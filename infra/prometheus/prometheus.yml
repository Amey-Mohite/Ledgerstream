# Prometheus — Phase 0
# Scrapes application metrics that the OTel Collector re-exports, plus itself.
# Service targets (payment/ledger/gateway) are added as they come online.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # App metrics arrive via OTLP at the collector, which re-exports them on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
