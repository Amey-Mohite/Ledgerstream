# =============================================================================
# secret.yaml — all SENSITIVE env, delivered to pods the same way as the
# ConfigMap (via envFrom). A k8s Secret is like a ConfigMap but intended for
# sensitive values (stored base64-encoded; enable encryption-at-rest + RBAC in
# real clusters).
#
# ponytail: ONE shared Secret for the whole release keeps the chart simple, but
# every pod then receives every secret (payment can read ANTHROPIC_API_KEY it
# never uses). Split into per-service Secrets if you want least-privilege
# isolation between services.
#
# Values are PLACEHOLDERS in values.yaml — supply real ones at install time
# (helm --set-string, Terraform set_sensitive, or External Secrets Operator).
# Never commit real secrets here.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  # e.g. "ledgerstream-secrets" — referenced by every Deployment's envFrom.
  name: {{ include "ledgerstream.fullname" . }}-secrets
  labels:
    {{- include "ledgerstream.labels" . | nindent 4 }}
# Opaque = arbitrary key/value secret (vs typed ones like kubernetes.io/tls).
type: Opaque
# stringData takes PLAIN text and k8s base64-encodes it for us (vs `data`, which
# expects you to pre-encode). One entry per key in values.yaml `secretEnv`.
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
